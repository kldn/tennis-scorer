name: tennis_scorer
description: Tennis match analysis companion app for iPhone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  fl_chart: ^0.70.2
  sign_in_with_apple: ^6.1.4
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  go_router: ^15.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
